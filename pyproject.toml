[project]
name = "rqark-app"
version = "0.11.9"
description = "Session, provider and agent management on top of rqark-core, with optional rqark-data-cloud integration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "RedQueenArk" }]
keywords = ["agent", "llm", "openai", "session"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "certifi>=2026.10.23",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pyyaml>=6.0.3",
    "rqark-core==0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/Red-Queen-Ark/rqark-app"
Repository = "https://github.com/Red-Queen-Ark/rqark-app"
Issues = "https://github.com/Red-Queen-Ark/rqark-app/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rqark_app"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]

[tool.ruff]
exclude = ["*.ipynb"]
line-length = 240
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ty.src]
exclude = ["tests/"]

[tool.ty.environment]
python-platform = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = []
filterwarnings = ["default"]